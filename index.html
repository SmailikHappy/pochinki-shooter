<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Discord Activity — Hello World</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1f22;
      color: #f2f3f5;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    #status {
      font-size: 24px;
      padding: 16px;
    }
    .error {
      color: #f23f42;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div>
    <h1 id="status">Загрузка...</h1>
  </div>

  <script type="module">
    import { DiscordSDK } from 'https://esm.sh/@discord/embedded-app-sdk';

    // Замените на client_id вашего приложения из Discord Developer Portal
    const CLIENT_ID = '1543173947325943911';

    const statusEl = document.getElementById('status');
    const discordSdk = new DiscordSDK(CLIENT_ID);

    async function setup() {
      // Ждём готовности клиента Discord
      await discordSdk.ready();

      // Открываем окно авторизации и получаем code
      const { code } = await discordSdk.commands.authorize({
        client_id: CLIENT_ID,
        response_type: 'code',
        state: '',
        prompt: 'none',
        scope: ['identify'],
      });

      // Меняем code на access_token через наш бэкенд
      // Discord proxy перенаправит /api/token -> ваш сервер по URL Mapping
      const response = await fetch('/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });

      if (!response.ok) {
        throw new Error(`Token exchange failed: ${response.status}`);
      }

      const { access_token } = await response.json();

      // Аутентифицируемся в клиенте Discord с полученным токеном
      const auth = await discordSdk.commands.authenticate({ access_token });

      statusEl.textContent = `Hello World! Привет, ${auth.user.username} 👋`;
    }

    setup().catch((err) => {
      console.error(err);
      statusEl.innerHTML = `Ошибка запуска Activity<br><span class="error">${err.message}</span>`;
    });
  </script>
</body>
</html>
