<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pochinki Shooter — Discord Activity</title>
  </head>
  <body>
    <main id="activity-shell">
      <section id="status-panel">
        <img id="guild-avatar" alt="" hidden />
        <h1 id="status">Подключение к Discord…</h1>
        <p id="error" role="alert" hidden></p>
      </section>

      <iframe
        id="unity-frame"
        title="Pochinki Shooter"
        allow="autoplay; fullscreen; gamepad"
        allowfullscreen
        hidden
      ></iframe>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
